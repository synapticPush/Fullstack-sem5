<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>College Admission Form</h1>

    <!-- Short Description -->
    <p>Please fill in your details below.</p>

    <!-- Admission Form -->
    <form>

        <!-- Student Name -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <!-- Father's Name -->
        <label for="father">Father's Name:</label><br>
        <input type="text" id="father" name="father"><br><br>

        <!-- Mother's Name -->
        <label for="mother">Mother's Name:</label><br>
        <input type="text" id="mother" name="mother"><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <!-- Address -->
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <!-- Course -->
        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <option>BA</option>
            <option>B.Tech</option>
        </select>

        <br><br>

        <!-- Hobbies -->
        <label>Hobbies:</label><br>

        <input type="checkbox" id="sports" name="hobby" value="Sports">
        <label for="sports">Sports</label><br>

        <input type="checkbox" id="music" name="hobby" value="Music">
        <label for="music">Music</label><br>

        <input type="checkbox" id="reading" name="hobby" value="Reading">
        <label for="reading">Reading</label><br><br>

        <!-- Upload Photo -->
        <label for="photo">Upload Photo:</label><br>
        <input type="file" id="photo" name="photo"><br><br>

        <!-- Password -->
        <label for="password">Create Password:</label><br>
        <input type="password" id="password" name="password"><br><br>

        <!-- Submit and Reset Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
